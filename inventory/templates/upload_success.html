{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="alert alert-success">
    <h4 class="alert-heading">Upload Successful!</h4>
    <p>File: <strong>{{ file.file.name }}</strong></p>
    <p>Uploaded By: {{ file.uploaded_by }}</p>
    <p>Uploaded At: {{ file.uploaded_at }}</p>
  </div>

  <div class="mt-4">
    <a href="{% url 'download_uploaded_file' document_id=file.pk %}" class="btn btn-outline-info">Download document</a>
  </div>
</div>
{% endblock %}
