<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - ERP Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body { background: #f6f7fc; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8 border border-indigo-100">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center mb-5 shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-envelope-circle-check text-white text-3xl"></i>
      </div>
      <p class="text-xs font-bold uppercase tracking-widest text-indigo-600">ERP Suite</p>
      <h1 class="text-2xl font-bold text-slate-800 mt-2">Check Your Email</h1>
      <p class="text-gray-600 mt-4">
        If an account matches that email address, password reset instructions have been sent. Check your inbox and spam folder.
      </p>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
      <p class="text-blue-700 text-sm">
        <i class="fa-solid fa-info-circle mr-2"></i>
        <strong>Tip:</strong> If you don't see the email, check your spam folder.
      </p>
    </div>

    <div class="text-center">
      <a 
        href="{% url 'login' %}"
        class="inline-block w-full bg-gradient-to-r from-indigo-600 to-violet-500 hover:from-indigo-500 hover:to-violet-400 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-500/20">
        Back to Login
      </a>
    </div>
  </div>
</body>
</html>
