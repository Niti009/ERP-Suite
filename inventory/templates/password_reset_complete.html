<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful - ERP Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-10">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-full bg-emerald-600 flex items-center justify-center mb-5">
        <i class="fa-solid fa-check-circle text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-800">Password Reset Successful!</h1>
      <p class="text-gray-600 mt-4">
        Your password has been successfully reset. You can now log in with your new password.
      </p>
    </div>

    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
      <p class="text-emerald-700">
        <i class="fa-solid fa-check mr-2"></i>
        <strong>All set!</strong> Your account is secure and ready to use.
      </p>
    </div>

    <div class="text-center">
      <a 
        href="{% url 'login' %}"
        class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 mb-3">
        <i class="fa-solid fa-arrow-right mr-2"></i>
        Log In Now
      </a>
    </div>

    <div class="text-center mt-4">
      <p class="text-gray-500 text-sm">
        If you didn't reset your password, please 
        <a href="mailto:support@erpsuite.com" class="text-blue-600 font-semibold hover:underline">
          contact support
        </a>
      </p>
    </div>
  </div>
</body>
</html>
