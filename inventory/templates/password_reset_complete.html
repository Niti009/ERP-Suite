<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful - ERP Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.22), transparent 24%), linear-gradient(135deg, #090e1d 0%, #111827 38%, #1f2a44 100%);">
  <div class="bg-white/95 rounded-3xl shadow-2xl w-full max-w-md p-10 border border-indigo-100">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center mb-5 shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-check-circle text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-800">Password Reset Successful!</h1>
      <p class="text-gray-600 mt-4">
        Your password has been successfully reset. You can now log in with your new password.
      </p>
    </div>

    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
      <p class="text-emerald-700">
        <i class="fa-solid fa-check mr-2"></i>
        <strong>All set!</strong> Your account is secure and ready to use.
      </p>
    </div>

    <div class="text-center">
      <a 
        href="{% url 'login' %}"
        class="inline-block w-full bg-gradient-to-r from-indigo-600 to-violet-500 hover:from-indigo-500 hover:to-violet-400 text-white font-semibold py-3 rounded-xl transition duration-200 mb-3 shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-arrow-right mr-2"></i>
        Log In Now
      </a>
    </div>

    <div class="text-center mt-4">
      <p class="text-gray-500 text-sm">
        If you didn't reset your password, please 
        <a href="mailto:support@erpsuite.com" class="text-indigo-600 font-semibold hover:underline">
          contact support
        </a>
      </p>
    </div>
  </div>
</body>
</html>
