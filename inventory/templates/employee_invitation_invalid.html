<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Unavailable - ERP Suite</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f6f7fc; color: #111827; font: 14px/1.5 "Segoe UI", Arial, sans-serif; }
    main { width: min(100%, 440px); padding: 36px; text-align: center; background: #fff; border: 1px solid #dfe7ff; border-radius: 20px; box-shadow: 0 18px 48px rgba(15,23,42,.12); }
    h1 { margin: 0 0 12px; font-size: 23px; }
    p { margin: 0 0 22px; color: #5b6479; }
    a { display: inline-block; padding: 11px 18px; border-radius: 10px; background: #4f46e5; color: white; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Invitation unavailable</h1>
    <p>This invitation link is invalid, expired, or has already been used. Contact your company administrator for a new invitation.</p>
    <a href="{% url 'login' %}">Return to sign in</a>
  </main>
</body>
</html>
