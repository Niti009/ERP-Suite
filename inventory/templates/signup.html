<!-- templates/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - ERP Suite</title>
  <style>
    :root {
      --bg: #eef2ff;
      --panel: #ffffff;
      --navy: #0f172a;
      --indigo: #4f46e5;
      --violet: #7c3aed;
      --lavender: #eef2ff;
      --text: #111827;
      --muted: #5b6479;
      --border: #dfe7ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 20%),
                  linear-gradient(135deg, #090e1d 0%, #111827 40%, #1d2a48 100%);
      color: var(--text);
      margin: 0; padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .signup-container {
      background: rgba(255,255,255,0.96);
      padding: 0;
      border-radius: 26px;
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.28);
      width: min(92vw, 440px);
      overflow: hidden;
      border: 1px solid rgba(191, 219, 254, 0.65);
    }
    .brand-band {
      background: linear-gradient(135deg, #0f172a, #1e1b4b 50%, #4338ca);
      color: white;
      text-align: center;
      padding: 2rem 1.5rem 1.5rem;
    }
    .brand-mark {
      width: 60px; height: 60px; margin: 0 auto 1rem; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #5b7cff, #7c3aed);
      box-shadow: 0 14px 24px rgba(79, 70, 229, 0.35);
      font-size: 1.5rem;
    }
    h2 {
      margin: 0 0 0.4rem;
      font-size: 2rem;
      letter-spacing: -.03em;
      color: white;
    }
    .subtitle { margin: 0; color: rgba(224,231,255,0.82); font-size: 0.9rem; }
    .form-panel { padding: 1.8rem 1.5rem 1.5rem; }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 0.8rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1rem;
      font-size: 1rem;
      background: #f8faff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #8b9dff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }
    button {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: white;
      border: none;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.22);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(79, 70, 229, 0.25);
    }
    .login-link {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .login-link a {
      color: var(--indigo);
      text-decoration: none;
      font-weight: 700;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="brand-band">
      <div class="brand-mark"><i class="fa-solid fa-building"></i></div>
      <h2>ERP Suite</h2>
      <p class="subtitle">Create your account</p>
    </div>
    <div class="form-panel">
      <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" required />

        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" required />

        <button type="submit">Create account</button>
      </form>
      <div class="login-link">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
      </div>
    </div>
  </div>
</body>
</html>
